<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produtos | Cherry Secret 🍒</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- CABEÇALHO -->

    <header class="topo">

        <a
            href="index.html"
            class="logo"
        >
            🍒 <span>Cherry</span> Secret
        </a>


        <button
            class="menu-btn"
            id="menuBtn"
        >
            ☰
        </button>


        <nav id="nav">

            <a href="index.html">
                Início
            </a>

            <a href="produtos.html">
                Produtos
            </a>

            <a href="sobre.html">
                Sobre
            </a>

            <a href="contato.html">
                Contato
            </a>

            <a
                href="carrinho.html"
                class="cart-link"
            >
                🛍️ Carrinho
                <b id="cartCount">0</b>
            </a>

        </nav>

    </header>



    <!-- TÍTULO -->

    <main>

        <section class="page-title">

            <p class="eyebrow">
                CHERRY SECRET
            </p>

            <h1>
                Nossa coleção
            </h1>

            <p>
                Escolha suas peças favoritas.
            </p>

        </section>



        <!-- FILTROS -->

        <section class="section">

            <div class="filters">

                <button
                    class="filter active"
                    data-filter="todos"
                >
                    Todos
                </button>


                <button
                    class="filter"
                    data-filter="vestidos"
                >
                    Vestidos
                </button>


                <button
                    class="filter"
                    data-filter="conjuntos"
                >
                    Conjuntos
                </button>


                <button
                    class="filter"
                    data-filter="blusas"
                >
                    Blusas
                </button>

            </div>



            <!-- PRODUTOS -->

            <div
                class="products"
                id="allProducts"
            >

                <!-- Os produtos aparecerão
                aqui pelo JavaScript -->

            </div>

        </section>

    </main>



    <!-- RODAPÉ -->

    <footer>

        <div class="logo">
            🍒 <span>Cherry</span> Secret
        </div>

        <p>
            © 2026 Cherry Secret.
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
